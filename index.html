<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danish Writing Helper</title>
  <style>
    :root {
      --bg: #eef3f6;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --border: #d9e2ec;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --soft: #f7fafc;
      --success: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef6f8 0%, #f7fafc 100%);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    select,
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      padding: 12px 13px;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input[type="text"] {
      min-height: 44px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.5;
    }

    .checkbox-row {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--soft);
      min-height: 44px;
    }

    .checkbox-row label {
      font-weight: 600;
      color: var(--text);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    button.secondary {
      background: #e6eef8;
      color: #1f3b57;
    }

    button.secondary:hover {
      background: #d7e5f5;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    #status {
      color: var(--success);
      font-weight: 700;
    }

    .output {
      display: none;
      margin-top: 14px;
      padding: 14px;
      background: #eef3f8;
      border: 1px solid var(--border);
      border-radius: 14px;
      white-space: pre-wrap;
      max-height: 420px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.45;
    }

    .history-card {
      border: 1px solid var(--border);
      padding: 14px;
      margin-top: 12px;
      border-radius: 16px;
      background: var(--soft);
    }

    .history-card strong {
      display: block;
      margin-bottom: 5px;
    }

    .history-card small {
      color: var(--muted);
      line-height: 1.4;
    }

    .history-preview {
      white-space: pre-wrap;
      margin-top: 10px;
      color: #344054;
      line-height: 1.45;
    }

    .history-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .history-actions button {
      width: auto;
      padding: 9px 12px;
      font-size: 14px;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .control-grid,
      .actions {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>Danish Writing Helper</h1>
      <p class="subtitle">A small writing workspace for DU3 → PD3 practice: write, generate a teacher prompt, save your work, and reuse earlier texts.</p>
    </header>

    <section class="panel">
      <h2>Settings</h2>
      <div class="control-grid">
        <div class="field">
          <label for="mode">Correction mode</label>
          <select id="mode">
            <option>Gentle teacher</option>
            <option>Normal teacher</option>
            <option>Strict correction</option>
            <option>PD3 exam mode</option>
          </select>
        </div>

        <div class="field">
          <label for="style">Style</label>
          <select id="style">
            <option>Written Danish</option>
            <option>Spoken Danish</option>
          </select>
        </div>

        <div class="field">
          <label for="focus">Learning focus</label>
          <select id="focus">
            <option>Grammar accuracy</option>
            <option>Natural spoken Danish</option>
            <option>Written structure</option>
            <option>PD3 exam preparation</option>
            <option>Vocabulary and expressions</option>
          </select>
        </div>
      </div>

      <div class="checkbox-row" style="margin-top:14px;">
        <input type="checkbox" id="importantOnly" />
        <label for="importantOnly">Only the most important mistakes</label>
      </div>
    </section>

    <section class="panel">
      <h2>Writing</h2>

      <div class="field">
        <label for="task">Topic / Assignment (optional)</label>
        <input type="text" id="task" oninput="saveDraft()" placeholder="e.g. Jobsøgning i Danmark" />
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="answer">Your Danish Text</label>
        <textarea id="answer" oninput="saveDraft()" placeholder="Write your Danish text here..."></textarea>
      </div>

      <div class="actions">
        <button onclick="generatePrompt()">Generate prompt</button>
        <button class="secondary" onclick="copyPrompt()">Copy Prompt</button>
        <button class="secondary" onclick="togglePrompt()">Show / Hide</button>
        <button class="secondary" onclick="exportData()">Export Data</button>
        <button class="secondary" onclick="document.getElementById('importFile').click()">Import Data</button>
      </div>

      <input type="file" id="importFile" style="display:none" onchange="importData(event)" />

      <div id="preview" class="status"></div>
      <div id="status" class="status"></div>
      <div class="output" id="output"></div>
    </section>

    <section class="panel">
      <h2>Writing History</h2>
      <p class="status">Your last 10 writing tasks are saved here in this browser.</p>
      <div id="history"></div>
    </section>
  </div>

  <script>
    let prompt = "";


    function generatePrompt() {
      const task = document.getElementById('task').value;
      const answer = document.getElementById('answer').value;
      const mode = document.getElementById('mode').value;
      const importantOnly = document.getElementById('importantOnly').checked;
      const style = document.getElementById('style').value;
      const focus = document.getElementById('focus').value;


      let modeInstruction = "";

      if (mode === "Gentle teacher") {
        modeInstruction = "Be very supportive, highlight positives, correct softly.";
      } else if (mode === "Normal teacher") {
        modeInstruction = "Balance corrections and encouragement.";
      } else if (mode === "Strict correction") {
        modeInstruction = "Focus strongly on errors and precise corrections.";
      } else if (mode === "PD3 exam mode") {
        modeInstruction = "Focus on exam readiness, clarity, and PD3 expectations.";
      }

      prompt = `Act as a Danish teacher for an adult learner at DU3 Module 3 level, working toward PD3.
Mode: ${mode}.
${modeInstruction}


Here is the writing assignment:
${task}

Here is the student's answer:
${answer}

Follow these rules:
- Keep the learner's original style whenever possible
- Do NOT rewrite everything into overly advanced Danish
- Explain WHY something is wrong (simple explanation in Polish)

${style === 'Spoken Danish' ? '- Focus on natural spoken Danish, simple flow, and pronunciation-friendly phrases' : '- Focus on correct written Danish: grammar, word order, connectors, and clear structure'}
${importantOnly ? '- Focus ONLY on the most important, recurring, or blocking mistakes (ignore small details)' : '- Include both major and minor mistakes where helpful'}

${focus === 'Grammar accuracy' ? '- Prioritise grammatical correctness and clear rules' : ''}
${focus === 'Natural spoken Danish' ? '- Prioritise natural, everyday spoken Danish expressions' : ''}
${focus === 'Written structure' ? '- Prioritise clear structure, connectors, and paragraph organisation' : ''}
${focus === 'PD3 exam preparation' ? '- Prioritise PD3 exam criteria: clarity, argumentation, and correctness' : ''}
${focus === 'Vocabulary and expressions' ? '- Prioritise improving vocabulary and useful expressions' : ''}

STRUCTURED FEEDBACK (use clear headings and sections):

IMPORTANT: Format the entire response in **Markdown**.

### 1. Necessary corrections
### 2. Better natural Danish
### 3. PD3 upgrade
### 4. Grammar explanation in simple Polish
### 5. Useful expressions and phrases
### 6. Personalised follow-up exercises
### 7. Recurring error tracking
### 8. PD3 scoring hint
### 9. Model Answer (short)


Follow this structure strictly.

Additional instructions for section 9 (Model Answer):
- Write a short model answer (maximum 3–5 sentences)
- Use realistic PD3-level Danish
- Keep it natural and clear (not overly academic)
- Make it feel achievable for a learner moving from DU3 toward PD3
- Use useful connectors and natural sentence flow
- Focus on good structure rather than difficult vocabulary
- Present this section clearly in Markdown like the other sections (with heading and clean paragraph)
`;

      document.getElementById('preview').textContent = `Mode: ${mode} | Style: ${style} | Focus: ${focus}${importantOnly ? ' | Important mistakes only' : ''}`;
      document.getElementById('status').textContent = "✅ Prompt ready";
      document.getElementById('output').textContent = prompt;
      saveWritingHistory();
    }


    function copyPrompt() {
  const output = document.getElementById('output').textContent;
  navigator.clipboard.writeText(output);
  alert('Prompt copied!');
    }


    function togglePrompt() {
      const output = document.getElementById('output');
      output.style.display = output.style.display === 'none' ? 'block' : 'none';
    }
  function saveDraft() {
  localStorage.setItem('dansk_task', document.getElementById('task').value);
  localStorage.setItem('dansk_answer', document.getElementById('answer').value);
}

window.addEventListener('load', function() {
  document.getElementById('task').value = localStorage.getItem('dansk_task') || '';
  document.getElementById('answer').value = localStorage.getItem('dansk_answer') || '';
});
    function exportData() {
  const data = {
    task: document.getElementById('task').value,
    answer: document.getElementById('answer').value,
    history: JSON.parse(localStorage.getItem('writing_history') || '[]')
  };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: 'application/json' }
  );

  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'dansk-helper-backup.json';
  link.click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    const data = JSON.parse(e.target.result);

    document.getElementById('task').value = data.task || '';
    document.getElementById('answer').value = data.answer || '';

    if (Array.isArray(data.history)) {
      localStorage.setItem('writing_history', JSON.stringify(data.history));
    }

    saveDraft();
    renderWritingHistory();
    alert('Data imported!');
  };

  reader.readAsText(file);
}


function saveWritingHistory() {
  const task = document.getElementById('task').value.trim();
  const answer = document.getElementById('answer').value.trim();
  const mode = document.getElementById('mode').value;
  const style = document.getElementById('style').value;
  const focus = document.getElementById('focus').value;

  if (!answer) return;

  let history = JSON.parse(localStorage.getItem('writing_history') || '[]');

  const entry = {
    date: new Date().toLocaleString(),
    task: task || 'No topic',
    answer,
    mode,
    style,
    focus
  };

  history.unshift(entry);
  history = history.slice(0, 10);

  localStorage.setItem('writing_history', JSON.stringify(history));
  renderWritingHistory();
}

function renderWritingHistory() {
  const container = document.getElementById('history');
  if (!container) return;

  const history = JSON.parse(localStorage.getItem('writing_history') || '[]');
  container.innerHTML = '';

  if (history.length === 0) {
    container.innerHTML = '<p class="status">No writing history yet.</p>';
    return;
  }

  history.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'history-card';

    const preview = item.answer.length > 250 ? item.answer.substring(0, 250) + '...' : item.answer;

    card.innerHTML = `
      <strong>Writing ${index + 1}: ${item.task}</strong><br>
      <small>${item.date} | ${item.mode} | ${item.style} | ${item.focus}</small>
      <div class="history-preview">${preview}</div>
      <div class="history-actions">
        <button class="secondary" onclick="reuseWriting(${index})">Reuse</button>
        <button class="secondary" onclick="copyWriting(${index})">Copy text</button>
      </div>
    `;

    container.appendChild(card);
  });
}

function reuseWriting(index) {
  const history = JSON.parse(localStorage.getItem('writing_history') || '[]');
  const item = history[index];
  if (!item) return;

  document.getElementById('task').value = item.task === 'No topic' ? '' : item.task;
  document.getElementById('answer').value = item.answer;
  saveDraft();
  alert('Writing loaded back into the form.');
}

function copyWriting(index) {
  const history = JSON.parse(localStorage.getItem('writing_history') || '[]');
  const item = history[index];
  if (!item) return;

  navigator.clipboard.writeText(item.answer);
  alert('Writing copied!');
}

window.addEventListener('load', renderWritingHistory);

  </script>

</body>
</html>
