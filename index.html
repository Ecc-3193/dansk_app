<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danish Writing Helper v9</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: #f3f4f6;
  margin: 0;
  padding: 24px;
}
.container {
  max-width: 1000px;
  margin: auto;
}
.panel {
  background: #1f2937;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
}
textarea, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #111827;
  color: white;
  margin-top: 8px;
}
textarea {
  min-height: 160px;
}
button {
  margin-top: 10px;
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
}
.feedback-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}
.feedback-card {
  background: #374151;
  padding: 10px 14px;
  border-radius: 999px;
}
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h1>Danish Writing Helper v9</h1>

    <label>Learning focus</label>
    <select id="focus">
      <option>Grammar accuracy</option>
      <option>Natural spoken Danish</option>
      <option>Written structure</option>
      <option>PD3 exam preparation</option>
      <option>Vocabulary and expressions</option>
    </select>

    <label>Your Danish Text</label>
    <textarea id="answer"></textarea>

    <button onclick="generateFeedback()">Generate feedback focus</button>

    <div id="feedback" class="feedback-grid"></div>
  </div>
</div>

<script>
function generateFeedback() {
  const focus = document.getElementById('focus').value;
  const feedback = document.getElementById('feedback');

  let cards = ['Grammar', 'Word order'];

  if (focus === 'PD3 exam preparation') {
    cards.push('PD3 structure');
    cards.push('Argumentation');
  }

  if (focus === 'Vocabulary and expressions') {
    cards.push('Vocabulary');
    cards.push('Useful expressions');
  }

  if (focus === 'Natural spoken Danish') {
    cards.push('Natural flow');
    cards.push('Conversation phrases');
  }

  if (focus === 'Written structure') {
    cards.push('Connectors');
    cards.push('Paragraph structure');
  }

  feedback.innerHTML = '';

  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'feedback-card';
    div.textContent = '✓ ' + card;
    feedback.appendChild(div);
  });
}
</script>
</body>
</html>
